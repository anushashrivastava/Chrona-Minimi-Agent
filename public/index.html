<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat agent</title>
<style>
  :root { --bg:#faf9f7; --fg:#1d1c1a; --muted:#7a766f; --card:#fff; --line:#e6e3dd; --accent:#2f5d50; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  header span { color:var(--muted); font-weight:400; margin-left:8px; font-size:14px; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:760px; width:100%; margin:0 auto; }
  .msg { margin:0 0 18px; }
  .user { background:var(--accent); color:#fff; padding:10px 14px; border-radius:14px; margin-left:auto; width:fit-content; max-width:85%; white-space:pre-wrap; }
  .bot { max-width:100%; }
  .bot p { margin:0 0 10px; } .bot ul { margin:0 0 10px; padding-left:22px; }
  .bot code { background:#eee9e0; padding:1px 5px; border-radius:4px; font-size:14px; }
  .bot a { color:var(--accent); }
  .bot sup a { text-decoration:none; font-weight:600; }
  .status { color:var(--muted); font-size:14px; margin:0 0 8px; }
  .sources { margin-top:8px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; }
  .sources a { border:1px solid var(--line); background:var(--card); padding:2px 8px; border-radius:999px; text-decoration:none; color:var(--fg); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  form { border-top:1px solid var(--line); padding:14px 20px; display:flex; gap:10px; max-width:760px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; background:var(--card); }
  button { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>Chat agent <span>web search + memory</span></header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Ask anything…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let userId = localStorage.getItem('userId');
if (!userId) { userId = crypto.randomUUID(); localStorage.setItem('userId', userId); }

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Minimal, safe markdown: escape first, then add bold/code/links/lists/citations.
function md(text, sources) {
  const byN = Object.fromEntries((sources||[]).map(s => [s.n, s]));
  let h = esc(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(\d+)\]/g, (m, n) => byN[n] ? `<sup><a href="${esc(byN[n].url)}" target="_blank" rel="noopener" title="${esc(byN[n].title)}">${n}</a></sup>` : m);
  const blocks = h.split(/\n{2,}/).map(b => {
    const lines = b.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) return '<ul>' + lines.map(l => '<li>' + l.replace(/^\s*[-*] /, '') + '</li>').join('') + '</ul>';
    return '<p>' + lines.join('<br>') + '</p>';
  });
  return blocks.join('');
}

function addUser(text) {
  const d = document.createElement('div'); d.className = 'msg user'; d.textContent = text; log.appendChild(d); scroll();
}
function addBot() {
  const d = document.createElement('div'); d.className = 'msg bot';
  d.innerHTML = '<div class="status"></div><div class="body"></div><div class="sources"></div><div class="meta"></div>';
  log.appendChild(d); scroll(); return d;
}
function renderSources(el, sources) {
  el.querySelector('.sources').innerHTML = sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${s.n} · ${esc(new URL(s.url).hostname.replace(/^www\./,''))}</a>`).join('');
}
function scroll() { log.scrollTop = log.scrollHeight; }

async function loadHistory() {
  const r = await fetch('/api/history?userId=' + userId).then(r => r.json());
  for (const t of r.turns) {
    addUser(t.user);
    const b = addBot(); b.querySelector('.body').innerHTML = md(t.answer, t.sources); renderSources(b, t.sources);
    b.querySelector('.meta').textContent = new Date(t.ts).toLocaleString();
  }
}

async function send(text) {
  addUser(text);
  const bot = addBot();
  const status = bot.querySelector('.status'), body = bot.querySelector('.body');
  status.textContent = 'Thinking…';
  let acc = '', sources = [];
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ userId, message: text, tz }) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = raw.split('\n').find(l => l.startsWith('data:'))?.slice(5).trim(); if (!data) continue;
        const e = JSON.parse(data);
        if (e.type === 'status') status.textContent = e.text;
        else if (e.type === 'reset') { acc = ''; body.innerHTML = ''; }
        else if (e.type === 'text') { acc += e.delta; status.textContent = ''; body.innerHTML = md(acc, sources); }
        else if (e.type === 'sources') { sources = e.sources; body.innerHTML = md(acc, sources); renderSources(bot, sources); }
        else if (e.type === 'done') { bot.querySelector('.meta').textContent = `${e.searches.length} search${e.searches.length===1?'':'es'} · first token ${e.timings.firstTokenMs ?? '–'} ms · total ${(e.timings.totalMs/1000).toFixed(1)} s`; }
        else if (e.type === 'error') { status.textContent = ''; body.innerHTML = '<p>Something went wrong: ' + esc(e.message) + '</p>'; }
        scroll();
      }
    }
  } catch (err) { status.textContent = ''; body.innerHTML = '<p>Network error: ' + esc(String(err)) + '</p>'; }
  sendBtn.disabled = false; input.focus();
}

form.addEventListener('submit', e => { e.preventDefault(); const t = input.value.trim(); if (!t || sendBtn.disabled) return; input.value = ''; send(t); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
loadHistory();
</script>
</body>
</html>
